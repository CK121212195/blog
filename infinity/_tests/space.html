<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#000}canvas{width:100vw;height:100vh;display:block}</style></head>
<body><canvas id="c"></canvas><script type="module">
import { mountSpace } from '../assets/js/space.js';
const s = mountSpace(document.getElementById('c'), { quality: 0.9, shift: (w) => (w > 1.2 ? 0.32 : 0), zoom: (w) => (w > 1.2 ? 1 : 0.8), onError: (e) => console.error('GL', e.message) });
window.__ok = !!s;
if (s) s.setSeed([60, 128, 1, 100]);
</script></body></html>
